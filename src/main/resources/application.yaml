spring:
  application:
    name: rtvs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rtvsdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:3893}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-minimum-32-chars-padded}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
