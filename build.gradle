plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'rtvs'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-json'

    // BDD — Cucumber 7
    testImplementation 'io.cucumber:cucumber-java:7.22.2'
    testImplementation('io.cucumber:cucumber-spring:7.22.2') {
        exclude group: 'org.springframework'
    }
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.22.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.3'

    // Contract testing — Pact 4.6
    testImplementation('au.com.dius.pact.consumer:junit5:4.6.16') {
        exclude group: 'org.springframework'
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    testImplementation('au.com.dius.pact.provider:junit5spring:4.6.16') {
        exclude group: 'org.springframework'
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/CucumberSuiteRunner*'
    exclude '**/bdd/**'
    exclude '**/pact/**'
}

tasks.register('cucumberTest', Test) {
    description = 'Run Cucumber BDD integration tests'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/CucumberSuiteRunner*'
}

tasks.register('pactConsumerTest', Test) {
    description = 'Generate Pact consumer contracts'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/pact/consumer/**'
}

tasks.register('pactProviderTest', Test) {
    description = 'Verify Pact provider contracts'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/pact/provider/**'
    dependsOn pactConsumerTest
}
